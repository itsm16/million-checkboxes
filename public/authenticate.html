<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
</head>
<style>
    body {
        background-color: #000000;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    
    .container {
        width: 100%;
        max-width: 400px;
        background-color: #111111;
        border: 1px solid #333333;
        padding: 40px;
        box-shadow: 0 4px 6px rgba(255, 255, 255, 0.1);
    }
    
    h2 {
        text-align: center;
        margin-bottom: 30px;
        font-weight: 300;
        letter-spacing: 1px;
    }
    
    .form-group {
        margin-bottom: 20px;
    }
    
    label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    
    input {
        width: 100%;
        padding: 12px;
        background-color: #000000;
        border: 1px solid #333333;
        color: #ffffff;
        font-size: 16px;
        box-sizing: border-box;
        transition: border-color 0.3s ease;
    }
    
    input:focus {
        outline: none;
        border-color: #ffffff;
    }
    
    input::placeholder {
        color: #666666;
    }
    
    button {
        width: 100%;
        padding: 14px;
        background-color: #ffffff;
        color: #000000;
        border: none;
        font-size: 16px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        transition: background-color 0.3s ease;
        margin-top: 10px;
    }
    
    button:hover {
        background-color: #cccccc;
    }
    
    button:active {
        background-color: #999999;
    }
    
    .error {
        color: #ff4444;
        font-size: 14px;
        margin-top: 10px;
        text-align: center;
        display: none;
    }
    
    .success {
        color: #44ff44;
        font-size: 14px;
        margin-top: 10px;
        text-align: center;
        display: none;
    }
    
    .signup-link {
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
    }
    
    a {
        color: #ffffff;
        text-decoration: none;
        border-bottom: 1px solid #ffffff;
    }
    
    a:hover {
        border-bottom-color: #cccccc;
    }
</style>
<body>
    <div class="container">
        <h2>SIGN IN</h2>
        <form id="signinForm">
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>
            
            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>
            
            <button type="submit">SIGN IN</button>
            
            <div class="error" id="errorMessage"></div>
            <div class="success" id="successMessage"></div>
        </form>
        
        <div class="signup-link">
            Don't have an account? <a href="/sign-up">Sign Up</a>
        </div>
    </div>

    <script>
        document.getElementById('signinForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const errorEl = document.getElementById('errorMessage');
            const successEl = document.getElementById('successMessage');
            const submitBtn = e.target.querySelector('button[type="submit"]');
            
            // Hide previous messages
            errorEl.style.display = 'none';
            successEl.style.display = 'none';
            
            // Get form data
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            
            try {
                submitBtn.disabled = true;
                submitBtn.textContent = 'SIGNING IN...';
                
                const response = await fetch('/o/authenticate/sign-in', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    successEl.textContent = 'Sign in successful! Token received.';
                    successEl.style.display = 'block';
                    
                    window.location.href = '/checkboxes'
                    // Store token and redirect or handle as needed
                    // if (result.token) {
                    //     localStorage.setItem('authToken', result.token);
                    //     console.log('Token stored:', result.token);
                    // }
                } else {
                    errorEl.textContent = result.message || 'Invalid email or password.';
                    errorEl.style.display = 'block';
                }
            } catch (error) {
                errorEl.textContent = 'Network error. Please try again.';
                errorEl.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'SIGN IN';
            }
        });
    </script>
</body>
</html>
