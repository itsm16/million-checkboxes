<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkboxes</title>
</head>
<style>
    body {
        background-color: #000000;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
    }
    
    .container {
        width: 100%;
        max-width: 800px;
        background-color: #111111;
        border: 1px solid #333333;
        padding: 40px;
        box-shadow: 0 4px 6px rgba(255, 255, 255, 0.1);
    }
    
    h2 {
        text-align: center;
        margin-bottom: 30px;
        font-weight: 300;
        letter-spacing: 1px;
    }
    
    .scroll-container {
        height: 600px;
        overflow-y: auto;
        border: 1px solid #333333;
        background-color: #000000;
    }
    
    .checkbox-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 10px;
        justify-content: center;
    }
    
    input[type="checkbox"] {
        width: 20px;
        height: 20px;
        cursor: pointer;
        margin: 0;
        background-color: #000000;
        border: 2px solid #808080;
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        position: relative;
    }
    
    input[type="checkbox"]:checked {
        background-color: #808080;
        border-color: #808080;
    }
    
    input[type="checkbox"]:checked::after {
        content: '✓';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #000000;
        font-size: 14px;
        font-weight: bold;
    }
    
    .info {
        margin-top: 10px;
        text-align: center;
        font-size: 12px;
        color: #666;
    }
</style>
<body>
    <div class="container">
        <h2>CHECKBOXES</h2>
        <div class="scroll-container" id="scrollContainer">
            <div id="checkboxContainer" class="checkbox-grid"></div>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const CHECKBOX_COUNT = 1000000
        const BATCH_SIZE = 2000 // Load 1500 checkboxes at a time
        const LOAD_THRESHOLD = 100 // Load more when 100px from bottom
        
        const scrollContainer = document.getElementById("scrollContainer")
        const checkboxContainer = document.getElementById("checkboxContainer")
        
        let currentCount = 0
        let isLoading = false
        let checkedStates = new Set()
        
        function loadMoreCheckboxes() {
            if (isLoading || currentCount >= CHECKBOX_COUNT) return
            
            isLoading = true
            const batchSize = Math.min(BATCH_SIZE, CHECKBOX_COUNT - currentCount)
            
            new Array(batchSize).fill(null).forEach(() => {
                const input = document.createElement("input")
                input.type = "checkbox"
                input.id = `checkbox-${++currentCount}`
                input.addEventListener('change', (e) => handleClick({id: input.id, checked: e.target.checked}))
                
                // Apply initial state if checkbox was previously checked
                if (checkedStates.has(input.id)) {
                    input.checked = true
                }
                
                checkboxContainer.appendChild(input)
            })
            
            isLoading = false
        }
        
        function handleScroll() {
            const { scrollTop, scrollHeight, clientHeight } = scrollContainer
            
            // Check if user is near bottom
            if (scrollTop + clientHeight >= scrollHeight - LOAD_THRESHOLD) {
                loadMoreCheckboxes()
            }
        }
        
        // Initialize - load first batch
        scrollContainer.addEventListener('scroll', handleScroll)

        function handleClick({id, checked}){
            console.log(id)
            socket.emit("client:check-update", {id, checked})
        }

        socket.on("server:check-update", ({id, checked})=>{
            // console.log("Received checkbox update:", checkbox)
            const foundCheck = document.getElementById(id)
            if (foundCheck) {
                foundCheck.checked = checked
                checkedStates.add(id)
            } else {
                console.log("Checkbox not found:", checkbox)
            }
        })
        
        // Fetch initial checkbox states
        async function fetchInitialStates() {
            try {
                const response = await fetch('/api/checkboxes')
                const data = await response.json()
                checkedStates = new Set(data.checked)
            } catch (error) {
                console.error('Failed to fetch initial states:', error)
            }
        }

        // Check authentication status
        async function checkAuth() {
            try {
                const response = await fetch('/api/user-info')
                if (!response.ok) {
                    window.location.href = '/o/authenticate'
                    return false
                }
                return true
            } catch (error) {
                console.error('Auth check failed:', error)
                window.location.href = '/o/authenticate'
                return false
            }
        }

        // Initialize
        checkAuth().then(isAuthenticated => {
            if (isAuthenticated) {
                fetchInitialStates().then(() => {
                    loadMoreCheckboxes()
                })
            }
        })
    </script>
</body>
</html>
